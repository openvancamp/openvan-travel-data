name: Daily snapshot

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: snapshot

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch
        run: python scripts/snapshot.py
      - name: Commit
        if: always()
        run: |
          git config user.name "openvan-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data history
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "data: snapshot $(cat data/updated.txt)"
          git push
